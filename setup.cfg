[flake8]
exclude =
    .venv,
    .git,
    __pycache__,
    .pytest_cache,
    */migrations/*
extend-ignore =
    # W503 line break before binary operator
    W503,
    # E203 whitespace before ':' (contradicts black)
    E203,
    # E501 line too long (handled by black)
    E501
max-complexity = 10
max-line-length = 90
